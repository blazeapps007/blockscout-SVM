version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  # one-shot: the backend image runs as UID 10001 and needs to own its
  # bind-mounted dirs (same pattern as db-init)
  backend-init:
    image: postgres:17
    volumes:
      - ./logs/:/logs/
      - ./dets/:/dets/
    entrypoint:
      - sh
      - -c
      - |
        chown -R 10001:10001 /logs /dets

  backend:
    depends_on:
      db:
        condition: service_started
      redis-db:
        condition: service_started
      backend-init:
        condition: service_completed_successfully
      # Not required to boot — the backend queries the verifier per request, not at startup — but
      # listed so `docker compose up -d backend` brings it along. Without this, recreating only the
      # backend after an env change leaves MICROSERVICE_SC_VERIFIER_URL pointing at a container
      # that was never started, and the symptom is indistinguishable from the misconfiguration it
      # replaced: an empty compiler list and `Fail - Unable to verify`.
      sc-verifier:
        condition: service_started
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 11.3.0
    # local fork build — must not be clobbered by upstream pulls
    # (services/backend.yml sets ghcr.io image + pull_policy: always)
    image: blockscout-svm:11.3.0
    pull_policy: build
    links:
      - db:database

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  # Source verification. This service was MISSING from this file: `microservices.yml` was
  # flattened into the base compose, but `sc-verifier` was dropped, so the stack ran with no
  # verifier at all. The backend then fell back to its hardcoded default URL,
  # https://eth-bytecode-db.services.blockscout.com, which is Blockscout's PUBLIC CROSS-CHAIN
  # bytecode->source database rather than a compiler. Two consequences, both observed on 81630:
  #
  #   1. /api/v2/smart-contracts/verification/config reported
  #      "solidity_compiler_versions": [] — nothing can be verified, and every submission fails
  #      with the unhelpful `Fail - Unable to verify`.
  #   2. Contracts got labelled with OTHER PROJECTS' names. A Uniswap V3 fork built with
  #      metadata.bytecodeHash: 'none' has no project-unique bytes, so it matches any other
  #      renamed fork already in that global DB. Our V3 factory displayed as `UpheavalV3Factory`.
  #      That is eth-bytecode-db working as designed on metadata-stripped bytecode, not a bug.
  #
  # The local verifier compiles the source that was actually submitted, so it fixes both.
  # No host port is published: only the backend talks to it, over the compose network.
  sc-verifier:
    extends:
      file: ./services/smart-contract-verifier.yml
      service: smart-contract-verifier
    volumes:
      # The image's default COMPILERS_DIR is /tmp/solidity-compilers, which is ephemeral. Without
      # a volume every restart re-downloads solc from binaries.soliditylang.org, and until that
      # finishes the compiler list is empty again — i.e. the exact failure above, intermittently.
      - solc-compilers:/tmp/solidity-compilers
      - vyper-compilers:/tmp/vyper-compilers

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy

volumes:
  # Downloaded solc/vyper binaries. Persisting them keeps the compiler list populated across
  # restarts instead of leaving a window where verification silently fails.
  solc-compilers:
  vyper-compilers:

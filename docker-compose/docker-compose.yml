version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  # one-shot: the backend image runs as UID 10001 and needs to own its
  # bind-mounted dirs (same pattern as db-init)
  backend-init:
    image: postgres:17
    volumes:
      - ./logs/:/logs/
      - ./dets/:/dets/
    entrypoint:
      - sh
      - -c
      - |
        chown -R 10001:10001 /logs /dets

  backend:
    depends_on:
      db:
        condition: service_started
      redis-db:
        condition: service_started
      backend-init:
        condition: service_completed_successfully
      # Not required to boot — the backend queries the verifier per request, not at startup — but
      # listed so `docker compose up -d backend` brings it along. Without this, recreating only the
      # backend after an env change leaves MICROSERVICE_SC_VERIFIER_URL pointing at a container
      # that was never started, and the symptom is indistinguishable from the misconfiguration it
      # replaced: an empty compiler list and `Fail - Unable to verify`.
      sc-verifier:
        condition: service_started
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 11.3.0
    # local fork build — must not be clobbered by upstream pulls
    # (services/backend.yml sets ghcr.io image + pull_policy: always)
    image: blockscout-svm:11.3.0
    pull_policy: build
    links:
      - db:database

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  # Source verification. This service was MISSING from this file: `microservices.yml` was
  # flattened into the base compose, but `sc-verifier` was dropped, so the stack ran with no
  # verifier at all. The backend then fell back to its hardcoded default URL,
  # https://eth-bytecode-db.services.blockscout.com, which is Blockscout's PUBLIC CROSS-CHAIN
  # bytecode->source database rather than a compiler. Two consequences, both observed on 81630:
  #
  #   1. /api/v2/smart-contracts/verification/config reported
  #      "solidity_compiler_versions": [] — nothing can be verified, and every submission fails
  #      with the unhelpful `Fail - Unable to verify`.
  #   2. Contracts got labelled with OTHER PROJECTS' names. A Uniswap V3 fork built with
  #      metadata.bytecodeHash: 'none' has no project-unique bytes, so it matches any other
  #      renamed fork already in that global DB. Our V3 factory displayed as `UpheavalV3Factory`.
  #      That is eth-bytecode-db working as designed on metadata-stripped bytecode, not a bug.
  #
  # The local verifier compiles the source that was actually submitted, so it fixes both.
  # No host port is published: only the backend talks to it, over the compose network.
  sc-verifier:
    extends:
      file: ./services/smart-contract-verifier.yml
      service: smart-contract-verifier
    # PINNED. services/smart-contract-verifier.yml defaults the tag to `latest`, and v1.11.0 made
    # SMART_CONTRACT_VERIFIER__COMPILERS__EXECUTION__TYPE mandatory — so `latest` crash-looped on
    # a config the env file (and upstream's own copy of it) does not set. A floating tag on a
    # service that panics at startup on an unset variable is how a working explorer breaks with no
    # change on our side.
    image: ghcr.io/blockscout/smart-contract-verifier:v1.11.1
    # Bounds `COMPILERS__EXECUTION__TYPE=native`, which runs solc in-process with no memory, CPU or
    # time limits of its own. Verification is unauthenticated, so without these a crafted payload
    # can take the host down rather than just this container.
    mem_limit: 4g
    cpus: 2.0
    # DO NOT mount a volume over /tmp/solidity-compilers. Doing so BREAKS verification: Docker
    # creates a named volume owned by root:root, this image runs as the unprivileged user `app`,
    # and the compiler installer then cannot write the solc binary it has just fetched —
    #
    #   compiler_cache: installing file version v0.8.10+commit.fc410830
    #   ERROR ... context: "fetching evm compiler",
    #           source: File(Os { code: 13, kind: PermissionDenied })
    #
    # — which Blockscout surfaces as the same generic `Fail - Unable to verify`, indistinguishable
    # from every other failure in this chain of problems. Unmounted, the directory is created by
    # the process itself in the container's writable layer with the right ownership.
    #
    # Nothing is lost. The compiler LIST is fetched over the network at startup either way; only
    # the binaries would be cached, they download lazily in roughly 350ms, and this chain needs
    # exactly two (0.8.10 and 0.7.6). Re-adding a volume here requires an init container to chown
    # it to `app` first — see backend-init, which exists for that same reason.

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy

